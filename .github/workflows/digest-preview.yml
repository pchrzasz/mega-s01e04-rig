name: Digest preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker in this preview
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Start rig with lane marker
        if: ${{ inputs.include_marker }}
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          PORT: 8787
        run: corepack pnpm start > /tmp/rig.log 2>&1 &

      - name: Start rig without lane marker
        if: ${{ !inputs.include_marker }}
        env:
          PORT: 8787
        run: env -u LANE_MARKER corepack pnpm start > /tmp/rig.log 2>&1 &

      - name: Wait for rig and save digest
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8787/digest/2026-10-28 -o /tmp/index.html
          mkdir -p _site
          mv /tmp/index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
